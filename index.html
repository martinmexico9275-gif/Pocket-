<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QuickShop Manager</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div>
      <h1>🛍️ QuickShop Manager</h1>
      <p>Manage your shop from your phone</p>
    </div>
  </header>

  <main>

    <!-- Dashboard -->
    <section class="dashboard">

      <div class="card">
        <span>Today's Sales</span>
        <strong id="todaySales">₦0</strong>
      </div>

      <div class="card">
        <span>Total Sales</span>
        <strong id="totalSales">₦0</strong>
      </div>

      <div class="card">
        <span>Total Profit</span>
        <strong id="totalProfit">₦0</strong>
      </div>

      <div class="card">
        <span>Products</span>
        <strong id="productCount">0</strong>
      </div>

    </section>

    <!-- Add Product -->
    <section class="box">

      <h2>📦 Add Product</h2>

      <input id="productName" type="text" placeholder="Product name">

      <input id="productCost" type="number" placeholder="Cost price">

      <input id="productPrice" type="number" placeholder="Selling price">

      <input id="productStock" type="number" placeholder="Stock quantity">

      <button onclick="addProduct()">Add Product</button>

    </section>

    <!-- Products -->
    <section class="box">

      <h2>Products</h2>

      <div id="products"></div>

    </section>

    <!-- Record Sale -->
    <section class="box">

      <h2>💰 Record Sale</h2>

      <select id="saleProduct">
        <option value="">Select product</option>
      </select>

      <input id="saleQuantity" type="number" min="1" placeholder="Quantity">

      <input id="customerName" type="text" placeholder="Customer name (optional)">

      <select id="paymentType">
        <option value="paid">Paid</option>
        <option value="credit">Credit / Owing</option>
      </select>

      <button onclick="recordSale()">Record Sale</button>

    </section>

    <!-- Customers -->
    <section class="box">

      <h2>👥 Customers Owing</h2>

      <div id="debts"></div>

    </section>

    <!-- Sales -->
    <section class="box">

      <h2>🧾 Recent Sales</h2>

      <div id="sales"></div>

    </section>

    <button class="danger" onclick="clearData()">
      Reset All Shop Data
    </button>

  </main>

  <script src="script.js"></script>

</body>
</html>
